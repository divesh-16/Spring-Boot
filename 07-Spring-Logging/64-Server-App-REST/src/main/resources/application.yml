spring:
  application:
    name : 65-Server-App-REST-Logging
  datasource:
    dbcp2.driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3300/springboot
    username: root
    password: root123
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties: 
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update	
server:
  port: 8081

#Logging Information
logging:
  level:
    com.tca: DEBUG
  file:
    name: logs/log.txt